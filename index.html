
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>stefanm8's Personal Website</title>
</head>
<body>

    <h1>
        <a href="https://github.com/stefanm8">stefanm8's</a> space
    </h1>

    <h3>
        Check my <a href="https://www.linkedin.com/in/stefan-mihartescu/">linkedin</a>
    </h3>

    <h3> Want to get in contact ? </h3>
    
    <p> email me at: stefanmihartescu@gmail.com </p>

    <p> Tune in this will eventually turn into a blog </p>

    <div id="container">

    </div>


    <script>
        async function getPages() {
            const pages = await fetch("https://api.github.com/repos/stefanm8/stefanm8.github.io/contents/assets/blog")
            console.log(pages)
            const pagesJson = await pages.json()
            return pagesJson.map(page => {
                p = {
                    path: page.name,
                    date: page.name.split("_")[0],
                    title: page.name.split("_")[1].replace(".html", "")
                }
                return p
            }).filter(page => page.endsWith(".html"))
        }

        async function renderPages(pages) {
            document.getElementById("container").innerHTML = pages.map(page => `<a href="assets/blog/${page.path}">${page.title}</a>`).join("")
        }

        async function main() {
            const pages = await getPages()
            console.log(pages)
            await renderPages(pages)
        }

        (async () => {
            await main()
        })()



    </script>
    
</body>
</html>
